<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan SDN Bambu Apus 01</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#2563eb,#7c3aed);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:rgba(255,255,255,.95);
width:100%;
max-width:500px;
padding:30px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
text-align:center;
}

.logo{
width:120px;
margin-bottom:15px;
}

h1{
font-size:24px;
color:#1e3a8a;
margin-bottom:5px;
}

.subtitle{
font-size:14px;
color:#666;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

#hasil{
margin-top:20px;
text-align:left;
}

</style>
</head>

<body>

<div class="card">

<img src="logo_sekolah.png" class="logo">

<h1>SDN BAMBU APUS 01</h1>

<p class="subtitle">
Pengumuman Kelulusan Kelas VI<br>
Tahun Pelajaran 2025/2026
</p>

<input
type="text"
id="peserta"
placeholder="Nomor Peserta">

<input
type="text"
id="nisn"
placeholder="NISN">

<button>
Lihat Hasil Kelulusan
</button>

<div id="hasil"></div>

</div>

</body>
</html>
