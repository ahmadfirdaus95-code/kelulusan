<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan SDN Bambu Apus 01</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
background:
linear-gradient(135deg,#2563eb,#7c3aed);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:rgba(255,255,255,.95);
backdrop-filter:blur(15px);
width:100%;
max-width:520px;
padding:35px;
border-radius:28px;
box-shadow:0 25px 50px rgba(0,0,0,.2);
text-align:center;
animation:fadeIn .5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
width:120px;
margin-bottom:15px;
}

.school{
font-size:28px;
font-weight:700;
color:#1e3a8a;
margin-bottom:8px;
}

.title{
font-size:18px;
font-weight:600;
margin-bottom:10px;
}

.desc{
font-size:14px;
color:#666;
line-height:1.6;
margin-bottom:25px;
}

.input-group{
text-align:left;
margin-bottom:15px;
}

label{
display:block;
font-size:14px;
margin-bottom:6px;
font-weight:600;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#2563eb;
box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.2s;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
transform:translateY(-2px);
}

.info{
margin-top:25px;
padding-top:20px;
border-top:1px solid #eee;
font-size:12px;
color:#666;
line-height:1.6;
}

.error{
margin-top:15px;
color:red;
font-size:14px;
font-weight:600;
}

</style>
</head>

<body>

<div class="card">

<img src="logo_sekolah.png" class="logo">

<div class="school">
SDN BAMBU APUS 01
</div>

<div class="title">
Pengumuman Kelulusan Kelas VI
</div>

<div class="desc">
Tahun Pelajaran 2025/2026
</div>

<div class="input-group">
<label>Nomor Peserta</label>
<input
type="text"
id="peserta"
placeholder="Masukkan Nomor Peserta">
</div>

<div class="input-group">
<label>NISN</label>
<input
type="text"
id="nisn"
placeholder="Masukkan NISN">
</div>

<button onclick="lanjutHasil()">
Lihat Hasil Kelulusan
</button>

<div id="error" class="error"></div>

<div class="info">
Jl. Bambu Apus Raya No.2, RT.3/RW.1<br>
Kelurahan Bambu Apus, Kecamatan Cipayung<br>
Kota Jakarta Timur
</div>

</div>

<script>

function lanjutHasil(){

const peserta =
document.getElementById("peserta").value.trim();

const nisn =
document.getElementById("nisn").value.trim();

if(!peserta || !nisn){

document.getElementById("error").innerHTML =
"Nomor Peserta dan NISN wajib diisi.";

return;

}

window.location.href =
`hasil.html?peserta=${encodeURIComponent(peserta)}&nisn=${encodeURIComponent(nisn)}`;

}

</script>

</body>
</html>
